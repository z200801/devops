# Example host-nginx config that fronts the rustfs Swarm stack.
#
# Reference for the upstream proxy contract (see ai/TODO.md §4 / README):
# nginx terminates public TLS and forwards HTTPS to Traefik's websecure
# entrypoint (WEBSECURE_PORT, default 19001). Adjust hostnames, ports,
# and cert paths to your environment.
#
# Requires in the http{} context (not shown here):
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#   limit_req_zone  $binary_remote_addr zone=req_limit_per_ip:10m rate=30r/s;
#   limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
#     (rate/burst must be generous — a SPA page load bursts many requests;
#      too-tight limits make nginx 503 the excess. Brute-force is on Traefik.)
#   map $http_user_agent $bad_agent { ... }   # optional

upstream upstream_s3 {
        # Traefik HTTPS/websecure entrypoint — NOT the web port (:19000),
        # which only 301-redirects to HTTPS and would loop.
        server 127.0.0.1:19001 weight=1;
        keepalive 16;
}

# ---------------------------------------------------------------------------
# S3 API vhost
# ---------------------------------------------------------------------------
server {
        server_name s3.example.local;
        server_tokens off;

        # S3 objects can be large — do not cap the body.
        client_max_body_size 0;

        # `http2 on;` needs nginx >= 1.25.1; use the listen parameter for
        # older versions.
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        ssl_certificate     /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # Parallel S3 clients (multipart, bucket listings) burst — keep this
        # generous or nginx returns 503 for the excess. Brute-force is handled
        # by Traefik fail2ban, not by a tight per-IP request cap here.
        limit_req  zone=req_limit_per_ip burst=100 nodelay;
        limit_conn conn_limit 100;

        client_header_timeout 10s;
        client_body_timeout   300s;    # tolerate large uploads
        keepalive_timeout     30s;
        send_timeout          300s;
        reset_timedout_connection on;

        # Optional hardening (uncomment/verify against your clients):
        # if ($http_user_agent = "") { return 403; }
        # if ($bad_agent)            { return 403; }

        location ~* \.(bak|conf|dist|fla|inc|ini|log|psd|sh|sql|swp)$ { deny all; return 404; }
        location ~ /\.                                                { deny all; return 404; }

        # Response security headers (add_header -> client; NOT proxy_set_header).
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

        location / {
                proxy_pass https://upstream_s3;

                # Traefik serves a self-signed cert internally.
                proxy_ssl_verify      off;
                proxy_ssl_server_name on;
                proxy_ssl_name        $host;

                proxy_http_version 1.1;
                proxy_set_header   Connection "";

                # Host is how Traefik routes; must be preserved.
                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # Traefik forwardedHeaders.trustedIPs (TRUSTED_PROXY_IPS) must
                # include THIS nginx host, or fail2ban bans nginx, not clients.

                # Stream large S3 bodies instead of buffering to disk.
                proxy_request_buffering off;
                proxy_buffering         off;
                proxy_read_timeout      300s;
                proxy_send_timeout      300s;

                proxy_cache_bypass $http_pragma $http_authorization;
                # Do NOT sub_filter/rewrite S3 response bodies — it corrupts payloads.
        }

        location /nginx_status {
                stub_status on;
                access_log  off;
                allow 127.0.0.1;
                allow 172.16.0.0/12;
                deny all;
        }
}

# ---------------------------------------------------------------------------
# Console vhost (browser SPA — same Traefik upstream, routed by Host)
# ---------------------------------------------------------------------------
server {
        server_name console.s3.example.local;
        server_tokens off;

        client_max_body_size 0;

        # `http2 on;` needs nginx >= 1.25.1; use the listen parameter for
        # older versions.
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        ssl_certificate     /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # The console is a SPA — one page load fetches many JS/CSS chunks in
        # a burst. A tight limit makes nginx 503 the excess, and the browser
        # then rejects those .js as text/html ("MIME type not executable").
        # Keep this generous; Traefik fail2ban covers brute-force.
        limit_req  zone=req_limit_per_ip burst=200 nodelay;
        limit_conn conn_limit 100;

        client_header_timeout 10s;
        client_body_timeout   300s;
        keepalive_timeout     30s;
        send_timeout          300s;
        reset_timedout_connection on;

        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

        location / {
                proxy_pass https://upstream_s3;

                proxy_ssl_verify      off;
                proxy_ssl_server_name on;
                proxy_ssl_name        $host;

                proxy_http_version 1.1;
                # WebSocket upgrade for the SPA console.
                proxy_set_header Upgrade    $http_upgrade;
                proxy_set_header Connection $connection_upgrade;

                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_buffering    off;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;

                proxy_cache_bypass $http_pragma $http_authorization;
        }
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS redirect for both hosts
# ---------------------------------------------------------------------------
server {
        listen 80;
        listen [::]:80;
        server_name s3.example.local console.s3.example.local;
        return 301 https://$host$request_uri;
}
