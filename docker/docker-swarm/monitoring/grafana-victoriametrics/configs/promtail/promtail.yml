server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:

  # ── Docker container logs ──────────────────────────────────────────────────
  # ./configs/promtail/promtail.yml
  - job_name: "docker-containers"
    docker_sd_configs:
      - host: "unix:///var/run/docker.sock"
        refresh_interval: 15s
        filters:
          - name: status
            values: ["running"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_swarm_service_name]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_stack_namespace]
        target_label: stack
      - source_labels: [__meta_docker_container_label_com_docker_swarm_task_name]
        target_label: task
      - source_labels: [__meta_docker_container_label_com_docker_swarm_node_id]
        target_label: swarm_node_id
    pipeline_stages:
      - docker: {}
      - labeldrop:
          - filename

  # ── System syslog ─────────────────────────────────────────────────────────
  - job_name: "system-syslog"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "syslog"
          __path__: "/var/log/syslog"
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\d+\s+\d+:\d+:\d+)\s+(?P<host>\S+)\s+(?P<process>[^\[]+)(?:\[(?P<pid>\d+)\])?\s*:\s*(?P<message>.*)$'
      - labels:
          host:
          process:
      # No timestamp stage on purpose: syslog RFC3164 ("Jan  2 15:04:05")
      # carries no timezone and the host writes local time. Parsing it as a
      # fixed location skews entries (e.g. +3h) so Loki rejects them as
      # "timestamp too new". Letting Loki stamp at ingestion is portable.

  # ── Auth log ──────────────────────────────────────────────────────────────
  - job_name: "system-auth"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "auth"
          __path__: "/var/log/auth.log"
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\d+\s+\d+:\d+:\d+)\s+(?P<host>\S+)\s+(?P<process>[^\[]+)(?:\[(?P<pid>\d+)\])?\s*:\s*(?P<message>.*)$'
      - labels:
          host:
          process:
