version: "3.8"

networks:
  monitoring:
    driver: overlay
    attachable: true

volumes:
  victoriametrics_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  alertmanager_data:
    driver: local
  promtail_positions:
    driver: local

configs:
  scrape_config:
    external: true
  loki_config:
    external: true
  promtail_config:
    external: true
  alertmanager_config:
    external: true
  grafana_datasources:
    external: true
  grafana_dashboards_provider:
    external: true

secrets:
  grafana_admin_user:
    external: true
  grafana_admin_password:
    external: true

services:

  # ── node-exporter — global, host resources ────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    # image: prom/node-exporter:v1.8.2
    networks:
      - monitoring
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)(\
        $$|/)"
      - "--collector.netstat"
      - "--collector.tcpstat"
      - "--collector.network_route"
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── cadvisor — global, container metrics ──────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    networks:
      - monitoring
    volumes:
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
      - type: bind
        source: /dev/disk
        target: /dev/disk
        read_only: true
    command:
      - "--docker_only=true"
      - "--store_container_labels=true"
      - "--whitelisted_container_labels=com.docker.swarm.service.name,com.docke\
        r.stack.namespace"
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── promtail — global, log shipping ───────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    networks:
      - monitoring
    volumes:
      - type: volume
        source: promtail_positions
        target: /var/lib/promtail
      - type: bind
        source: /var/log
        target: /var/log
        read_only: true
      - type: bind
        source: /var/lib/docker/containers
        target: /var/lib/docker/containers
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    command:
      - "-config.file=/etc/promtail/promtail.yml"
      - "-config.expand-env=true"
    configs:
      - source: promtail_config
        target: /etc/promtail/promtail.yml
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── swarm-exporter — manager only, stacks/services/overlay metrics ────────
  swarm-exporter:
    # Exposes swarm-level metrics (services, tasks, node state) on :9000.
    # Must run on a manager and read the Docker socket. Matches scrape job
    # "swarm-exporter" in configs/victoriametrics/scrape.yml (:9000).
    image: ghcr.io/neuroforgede/docker-swarm-exporter:0.1.0
    networks:
      - monitoring
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── victoriametrics — single node TSDB + scraper ──────────────────────────
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    networks:
      - monitoring
    volumes:
      - type: volume
        source: victoriametrics_data
        target: /storage
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=30d"
      - "--promscrape.config=/etc/victoriametrics/scrape.yml"
      - "--promscrape.config.strictParse=false"
      - "--httpListenAddr=:8428"
      - "--memory.allowedPercent=60"
    configs:
      - source: scrape_config
        target: /etc/victoriametrics/scrape.yml
    ports:
      - target: 8428
        published: 8428
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 30s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── loki — log aggregation ────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    networks:
      - monitoring
    volumes:
      - type: volume
        source: loki_data
        target: /loki
    command:
      - "-config.file=/etc/loki/loki.yml"
      - "-target=all"
    configs:
      - source: loki_config
        target: /etc/loki/loki.yml
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 30s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── alertmanager — Discord notifications ──────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    networks:
      - monitoring
    volumes:
      - type: volume
        source: alertmanager_data
        target: /alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── grafana — dashboards + alerting UI ────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    networks:
      - monitoring
    volumes:
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER__FILE=/run/secrets/grafana_admin_user
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
    secrets:
      - grafana_admin_user
      - grafana_admin_password
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        # Grafana 13.x idles ~330M but spikes on dashboard render / long-range
        # queries; 512M was still OOM-killed under load. Give it 1G of headroom.
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
