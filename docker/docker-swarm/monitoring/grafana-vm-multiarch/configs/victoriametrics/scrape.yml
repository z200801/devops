global:
  scrape_interval: 15s
  external_labels:
    cluster: "swarm"

scrape_configs:

  # ── Node Exporter ── host resources per node ──────────────────────────────
  # dockerswarm_sd discovers tasks via Docker socket mounted in VM container
  - job_name: "node-exporter"
    dockerswarm_sd_configs:
      - host: "unix:///var/run/docker.sock"
        role: tasks
        filters:
          - name: desired-state
            values: ["running"]
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: ".*node-exporter.*"
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: service
      - source_labels: [__meta_dockerswarm_task_slot]
        target_label: slot
      - source_labels: [__address__]
        regex: "([^:]+)(?::\\d+)?"
        replacement: "${1}:9100"
        target_label: __address__

  # ── Fail2ban Exporter ── host fail2ban jails (only nodes labeled fail2ban) ─
  # instance = node hostname so the dashboard's $node dropdown is stable.
  - job_name: "fail2ban-exporter"
    dockerswarm_sd_configs:
      - host: "unix:///var/run/docker.sock"
        role: tasks
        filters:
          - name: desired-state
            values: ["running"]
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: ".*fail2ban-exporter.*"
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: service
      - source_labels: [__address__]
        regex: "([^:]+)(?::\\d+)?"
        replacement: "${1}:9921"
        target_label: __address__

  # ── cAdvisor ── container metrics per node ────────────────────────────────
  - job_name: "cadvisor"
    dockerswarm_sd_configs:
      - host: "unix:///var/run/docker.sock"
        role: tasks
        filters:
          - name: desired-state
            values: ["running"]
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: ".*cadvisor.*"
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      - source_labels: [__meta_dockerswarm_service_label_com_docker_stack_namespace]
        target_label: stack
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: service
      - source_labels: [__address__]
        regex: "([^:]+)(?::\\d+)?"
        replacement: "${1}:8080"
        target_label: __address__

  # ── Docker daemon ── overlay network + swarm internals per manager node ───
  # Target is set at configs-create/configs-rotate time via DOCKER_METRICS_ADDR
  # (default 172.17.0.1:9323 for docker0). Set per host to where dockerd
  # binds its metrics endpoint in /etc/docker/daemon.json.
  - job_name: "docker-daemon"
    dockerswarm_sd_configs:
      - host: "unix:///var/run/docker.sock"
        role: nodes
    relabel_configs:
      - source_labels: [__meta_dockerswarm_node_manager_reachability]
        regex: "reachable"
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      - target_label: __address__
        replacement: "${DOCKER_METRICS_ADDR}"
      - target_label: service
        replacement: docker-daemon

  # ── Swarm Exporter ── stacks, services, task counts ───────────────────────
  - job_name: "swarm-exporter"
    dockerswarm_sd_configs:
      - host: "unix:///var/run/docker.sock"
        role: tasks
        filters:
          - name: desired-state
            values: ["running"]
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: ".*swarm-exporter.*"
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      - source_labels: [__address__]
        regex: "([^:]+)(?::\\d+)?"
        replacement: "${1}:8888"
        target_label: __address__

  # ── VictoriaMetrics self-monitoring ───────────────────────────────────────
  - job_name: "victoriametrics"
    static_configs:
      - targets: ["victoriametrics:8428"]
        labels:
          service: "victoriametrics"

  # ── Alertmanager self-monitoring ──────────────────────────────────────────
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: "alertmanager"

  # ── vmalert self-monitoring ───────────────────────────────────────────────
  - job_name: "vmalert"
    static_configs:
      - targets: ["vmalert:8880"]
        labels:
          service: "vmalert"
