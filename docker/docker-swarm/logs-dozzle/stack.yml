services:
  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "127.0.0.1:3080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - data:/data
    environment:
      DOZZLE_TAILSIZE: 300
      DOZZLE_FILTER: "status=running"
      # DOZZLE_BASE: /log
      # DOZZLE_LEVEL: debug
      DOZZLE_NO_ANALYTICS: "true"
      # DOZZLE_AUTH_PROVIDER: simple
      # privileged: true
      # secrets:
      #   - source: users
      #     target: /data/users.yml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '64M'
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 20s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.3
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 70s
        failure_action: pause
        monitor: 30s
        order: start-first
      placement:
        constraints:
          # Constraint on node role
          - node.role == manager
    # healthcheck:
    #   test: ["CMD", "curl", "-fs", "http://localhost:8080"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s          


networks:
  default:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: 1300

# secrets:
#   users:
#     file: data/users.yml

volumes:
  data:

